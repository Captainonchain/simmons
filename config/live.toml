# Simmons Live Trading Configuration
# Uses OnchainOS agentic wallet for DEX execution
# REAL MONEY - Use with caution!

mode = "live"
testnet = false

# Trading capital
capital_usd = 100
symbols = [
    "SOL-USDC",   # Solana DEX - high volume, low fees
    "ETH-USDC",   # Base DEX - L2 low fees
]

# OnchainOS Agentic Wallet addresses
[wallet]
solana = "ADgiAMEyksesoUjrza4Bc5VH4LqyDkFKyafCMJA5ZS6h"
evm = "0x328314bc40e7ef6c42eafd776341ab55631b163f"

# Chains to trade on
[chains]
enabled = ["solana", "base"]
solana_chain_id = "501"
base_chain_id = "8453"
ethereum_chain_id = "1"
arbitrum_chain_id = "42161"

# Conservative risk settings for live
[risk]
max_position_pct = 0.10       # 10% max per position
max_drawdown = 0.15           # 15% max drawdown - HALT ALL TRADING
kelly_fraction = 0.15         # 15% Kelly
daily_loss_limit = 20         # $20 daily loss limit
default_stop_loss_pct = 0.03  # 3% stop loss
default_take_profit_pct = 0.06 # 6% take profit (2:1 R:R)
max_positions = 3             # Max 3 concurrent positions
max_consecutive_losses = 3    # Circuit breaker after 3 losses

[feeds]
okx_ws_url = "wss://ws.okx.com:8443/ws/v5/public"
price_window_size = 100
update_interval_ms = 2000     # Faster updates for live

[alpha]
momentum_lookback = 14
rsi_period = 14
rsi_overbought = 70
rsi_oversold = 30
zscore_threshold = 2
min_confidence = 0.65         # Higher threshold for live

[execution]
use_onchainos_cli = true      # Use OnchainOS CLI for execution
max_slippage_bps = 50         # 0.5% slippage - tighter for live
mev_protection = true
preferred_venues = ["onchainos"]

# Gas settings
[execution.gas]
solana_priority_fee = "auto"
evm_gas_multiplier = 1.1      # 10% buffer

[brain]
data_dir = "data"
timeout_secs = 30             # Shorter timeout for live
auto_invoke = true            # Enable autonomous decisions

# TA Brain settings
[ta_brain]
update_interval_secs = 10
radar_elite_threshold = 250
radar_solid_threshold = 170
radar_marginal_threshold = 140

# Fund Brain settings
[fund_brain]
update_interval_secs = 30
onchain_weight = 0.5
twitter_weight = 0.3
news_weight = 0.2

# Consensus settings
[consensus]
ta_weight = 0.6
fund_weight = 0.4
min_confidence = 0.60
conflict_reduces_size = true
conflict_size_multiplier = 0.5
